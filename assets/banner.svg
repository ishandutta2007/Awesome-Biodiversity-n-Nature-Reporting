<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1d12" />
      <stop offset="50%" stop-color="#133320" />
      <stop offset="100%" stop-color="#07140b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #a7f3d0;
    }
    .pill-text {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #ffffff;
    }
    
    /* Dynamic CSS Animations */
    @keyframes floatWave1 {
      0% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-12px) scale(1.02); }
      100% { transform: translateY(0px) scale(1); }
    }

    @keyframes floatWave2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(15px); }
      100% { transform: translateY(0px); }
    }

    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }

    @keyframes dashCycle {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    .animated-wave-1 {
      animation: floatWave1 8s ease-in-out infinite;
      transform-origin: center;
    }

    .animated-wave-2 {
      animation: floatWave2 11s ease-in-out infinite;
      transform-origin: center;
    }

    .pulsing-orb {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }

    .chart-line {
      stroke-dasharray: 1000;
      animation: dashCycle 12s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Positioned to NOT overlap foreground text) -->
  <!-- Glowing Orbs in Corners & Background -->
  <circle cx="150" cy="60" r="180" fill="url(#emeraldGlow)" class="pulsing-orb" filter="url(#glow)" />
  <circle cx="1050" cy="240" r="200" fill="url(#emeraldGlow)" class="pulsing-orb" filter="url(#glow)" />

  <!-- Dynamic Abstract Wave Lines in Background -->
  <g opacity="0.25">
    <path class="animated-wave-1" d="M -50 220 Q 200 120, 450 240 T 950 180 T 1250 260" fill="none" stroke="#10b981" stroke-width="4" />
    <path class="animated-wave-2" d="M -50 100 Q 350 280, 650 140 T 1250 200" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="8 6" />
    <path d="M 0 270 Q 400 180, 800 280 T 1200 210" fill="none" stroke="#059669" stroke-width="1.5" />
  </g>

  <!-- Decorative Tech Grid Overlay (Right Side Accent) -->
  <g transform="translate(860, 40)" opacity="0.15">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#a7f3d0" stroke-width="1" />
    </pattern>
    <rect width="300" height="220" fill="url(#grid)" />
  </g>

  <!-- DYNAMIC DECORATIVE CARDS / PILLS (Kept cleanly in lower right & top header, completely outside title area) -->
  <g transform="translate(820, 175)" filter="url(#shadow)" class="animated-wave-1">
    <!-- Mini Metric Card 1 -->
    <rect x="0" y="0" width="150" height="75" rx="12" fill="#133e29" stroke="#10b981" stroke-width="1.5" opacity="0.95" />
    <text x="16" y="28" font-family="Segoe UI, sans-serif" font-size="11" fill="#a7f3d0" font-weight="600">TNFD &amp; CSRD</text>
    <text x="16" y="52" font-family="Segoe UI, sans-serif" font-size="18" fill="#ffffff" font-weight="700">Aligned ✔</text>
  </g>

  <g transform="translate(990, 175)" filter="url(#shadow)" class="animated-wave-2">
    <!-- Mini Metric Card 2 -->
    <rect x="0" y="0" width="160" height="75" rx="12" fill="#133e29" stroke="#34d399" stroke-width="1.5" opacity="0.95" />
    <text x="16" y="28" font-family="Segoe UI, sans-serif" font-size="11" fill="#a7f3d0" font-weight="600">Ecosystem Data</text>
    <text x="16" y="52" font-family="Segoe UI, sans-serif" font-size="18" fill="#34d399" font-weight="700">eDNA + AI</text>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed high visibility and crisp contrast) -->
  <g transform="translate(70, 75)">
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="225" height="30" rx="15" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="15" y="19" class="pill-text">🌿 NATURE INTELLIGENCE 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" class="title" filter="url(#shadow)">
      Awesome Biodiversity &amp; Nature Reporting
    </text>

    <!-- Subtitle -->
    <text x="0" y="115" class="subtitle">
      Curated SaaS Platforms, Geospatial AI &amp; Open-Source Monitoring Tools
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 142)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#10b981" opacity="0.2" />
      <rect x="0" y="0" width="130" height="26" rx="6" fill="none" stroke="#10b981" stroke-width="1" />
      <text x="12" y="17" font-family="Segoe UI, sans-serif" font-size="12" fill="#a7f3d0" font-weight="600">🌱 Natural Capital</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="145" height="26" rx="6" fill="#10b981" opacity="0.2" />
      <rect x="142" y="0" width="145" height="26" rx="6" fill="none" stroke="#10b981" stroke-width="1" />
      <text x="154" y="17" font-family="Segoe UI, sans-serif" font-size="12" fill="#a7f3d0" font-weight="600">📡 Remote Sensing</text>

      <!-- Tag 3 -->
      <rect x="299" y="0" width="135" height="26" rx="6" fill="#10b981" opacity="0.2" />
      <rect x="299" y="0" width="135" height="26" rx="6" fill="none" stroke="#10b981" stroke-width="1" />
      <text x="311" y="17" font-family="Segoe UI, sans-serif" font-size="12" fill="#a7f3d0" font-weight="600">🧬 eDNA Analytics</text>
    </g>
  </g>
</svg>
